name: Scheduled Model Retrain (Sprint 2)

# Runs every Monday at 03:00 UTC (00:00 BRT) and on manual trigger.
# Combats concept drift in PIX/TED/Boleto patterns.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without saving the model"
        required: false
        default: "false"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled retrain
        run: |
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            python scripts/scheduled_retrain.py --dry-run
          else
            python scripts/scheduled_retrain.py
          fi

      - name: Upload retrain history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-history
          path: logs/retrain_history.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload trained model
        if: github.event.inputs.dry-run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stacking-model
          path: models/stacking_fraud_model.pkl
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on drift detection
        if: failure()
        run: echo "::warning::Retrain failed - manual review needed"
